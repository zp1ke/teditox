name: teditox
description: Simple plain text editor.
publish_to: "none"
version: 0.1.6+7

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: 3.50.1

dependencies:
  charset_converter: ^2.5.1
  collection: ^1.19.1
  cupertino_icons: ^2.0.0
  cupertino_ui: ^1.1.7
  dynamic_color: ^2.1.0
  flex_color_scheme: ^9.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  get_it: ^9.3.0
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  intl: ^0.20.3
  logger: ^2.8.0
  material_ui: ^1.11.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.3
  provider: ^6.1.5+1
  receive_sharing_intent: ^1.9.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.3

dev_dependencies:
  # Pins the formatter `dart format` uses (it honors the project-resolved
  # dart_style). Without it, transitive deps decide the formatting style.
  dart_style: ^3.1.14
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  assets:
    - assets/fonts/Fira_Code/
    - assets/fonts/Inter/
    - assets/fonts/JetBrains_Mono/
    - assets/fonts/Nata_Sans/
    - assets/fonts/Open_Sans/
    - assets/fonts/Roboto/
    - assets/fonts/Source_Code_Pro/
  generate: true
  uses-material-design: true
