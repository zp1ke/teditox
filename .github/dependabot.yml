version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # SDK-coupled Flutter/Dart tooling: bumping these piecemeal tends to
      # produce conflicting constraints, so group them.
      flutter-tooling:
        patterns:
          - flutter_launcher_icons
          - flutter_native_splash
      ui-platform:
        patterns:
          - material_ui
          - cupertino_ui
          - flex_color_scheme
          - dynamic_color
          - google_fonts

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: bundler
    directory: /android
    schedule:
      interval: monthly
    labels:
      - dependencies