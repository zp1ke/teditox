name: Integration Tests

# Integration tests need an Android emulator, which is slow and flaky on shared
# runners. They run weekly (catching SDK/plugin drift), on demand, and on PRs
# labelled `integration` — not on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  pull_request:
    types: [labeled]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    name: Android emulator (API 34)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'integration'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: flutter test integration_test --reporter expanded