include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # gen-l10n output; regenerated by `flutter pub get`. The template still emits
    # flutter_localizations delegates (deprecated) - see ROADMAP Phase 0.5 note.
    - "lib/src/core/localization/app_localizations*.dart"
    - build/**
    - android/**
    - linux/**
  errors:
    invalid_annotation_target: ignore